name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: 语法与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q src/

  run:
    name: 端到端冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行比对流水线
        run: |
          python src/face_compare.py \
            --group samples/group.jpg \
            --host samples/host.png \
            --out-dir assets/results \
            --crop-dir assets/crops \
            --report assets/results/report.json
      - name: 三角验证
        run: |
          python src/triangulate.py \
            --group samples/group.jpg \
            --host samples/host.png \
            --panorama samples/classroom.png \
            --out-dir assets/results \
            --report assets/results/triangulation.json
      - name: 生成图表
        run: |
          python src/plot_results.py \
            --report assets/results/report.json \
            --triangulation assets/results/triangulation.json \
            --out-dir assets/charts
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: face-match-lab-results
          path: |
            assets/results/**
            assets/charts/**
