name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: 语法与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q src/ scripts/

  smoke:
    name: 端到端冒烟测试（公开示例）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 数据结构自检
        # CI 直接用仓库自带的 samples/（NASA 公有领域照片），无需用户数据目录。
        # 先把公开示例复制到 data/ 走一遍标准流程，确认结构与复制逻辑都正常。
        run: |
          python scripts/prepare_data.py --use-samples
          python scripts/prepare_data.py --check
      - name: 运行比对流水线
        run: |
          python src/face_compare.py \
            --samples \
            --out-dir results \
            --crop-dir results/crops \
            --report results/report.json
      - name: 三角验证
        run: |
          python src/triangulate.py \
            --samples \
            --out-dir results \
            --report results/triangulation.json
      - name: 生成图表
        run: |
          python src/plot_results.py \
            --report results/report.json \
            --triangulation results/triangulation.json \
            --out-dir assets/charts
      - name: 校验判定结果
        # 公开示例的期望结论：三对全部一致判定为同一人
        run: |
          python - <<'PY'
          import json, sys
          tri = json.load(open("results/triangulation.json", encoding="utf-8"))
          rep = json.load(open("results/report.json", encoding="utf-8"))
          if not tri["all_consistent"]:
              print("FAIL 三角验证未达成一致:", tri["pairs"]); sys.exit(1)
          if not rep["comparison"]["same_person"]:
              print("FAIL 主比对未判定为同一人"); sys.exit(1)
          if rep["ranking"][0]["cosine"] <= rep["ranking"][1]["cosine"]:
              print("FAIL 排名表未按相似度降序"); sys.exit(1)
          print(f"PASS 判定一致，top1={rep['ranking'][0]['cosine']}")
          PY
      - name: 负对照（换参考像应切换 Top-1）
        # 用 Cooper 肖像作参考像，Top-1 必须与 Glenn 情形不同，
        # 证明排名反映真实身份相似性，而非固定取最大脸
        run: |
          python src/face_compare.py \
            --samples \
            --reference samples/cooper_portrait.jpg \
            --out-dir results/neg \
            --crop-dir results/neg/crops \
            --report results/neg/report.json
          python - <<'PY'
          import json, sys
          glenn = json.load(open("results/report.json", encoding="utf-8"))
          coop  = json.load(open("results/neg/report.json", encoding="utf-8"))
          g, c = glenn["ranking"][0]["cosine"], coop["ranking"][0]["cosine"]
          if abs(g - c) < 1e-6:
              print(f"FAIL 换参考像后 Top-1 未切换 (both={g})"); sys.exit(1)
          print(f"PASS 负对照有效：Glenn={g} vs Cooper={c}")
          PY
      - name: 校验报告不含坐标泄露
        run: |
          python - <<'PY'
          import json, sys
          for path in ("results/report.json", "results/triangulation.json"):
              text = open(path, encoding="utf-8").read()
              for bad in ('"bbox"', '"center"', '"path"'):
                  if bad in text:
                      print(f"FAIL {path}: 仍包含敏感字段 {bad}")
                      sys.exit(1)
              json.loads(text)
          print("PASS 报告结构校验通过，无坐标泄露")
          PY
      - name: 隐私终审体检
        run: python scripts/privacy_audit.py
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: face-match-lab-results
          path: |
            results/*.json
            assets/charts/**
