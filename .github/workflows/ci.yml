name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: 语法与导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q src/ scripts/

  smoke:
    name: 端到端冒烟测试（公开示例）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 数据结构自检
        # CI 直接用仓库自带的 samples/（NASA 公有领域照片），无需用户数据目录。
        # 先把公开示例复制到 data/ 走一遍标准流程，确认结构与复制逻辑都正常。
        run: |
          python scripts/prepare_data.py --use-samples
          python scripts/prepare_data.py --check
      - name: 运行比对流水线
        run: |
          python src/face_compare.py \
            --samples \
            --out-dir results \
            --crop-dir results/crops \
            --report results/report.json
      - name: 三角验证
        run: |
          python src/triangulate.py \
            --samples \
            --out-dir results \
            --report results/triangulation.json
      - name: 生成图表
        run: |
          python src/plot_results.py \
            --report results/report.json \
            --triangulation results/triangulation.json \
            --out-dir assets/charts
      - name: 端到端自测（6 项断言）
        # scripts/selftest.py 把「跑得通」变成可断言的回归测试：
        # T1 主判定 / T2 唯一性 / T3 负对照 / T4 过线人数 / T5 三角验证 / T6 参考像鲁棒
        # 退出码非 0 即回归失败。
        run: |
          python scripts/selftest.py \
            --samples \
            --json results/selftest.json
      - name: 校验自测结果
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("results/selftest.json", encoding="utf-8"))
          failed = [c for c in data["checks"] if c["status"] == "FAIL"]
          skipped = [c for c in data["checks"] if c["status"] == "SKIP"]
          for c in data["checks"]:
              mark = {"PASS": "PASS", "FAIL": "FAIL", "SKIP": "SKIP"}[c["status"]]
              print(f"  {c['id']}  {mark:<5} {c['name']}  —  {c['detail']}")
          if failed:
              print(f"\nFAIL {len(failed)} 项断言未通过"); sys.exit(1)
          if skipped:
              print(f"\n警告：{len(skipped)} 项被跳过（缺第三视角）")
          print(f"\nPASS 全部断言通过")
          PY
      - name: 校验报告不含坐标泄露
        run: |
          python - <<'PY'
          import json, sys
          for path in ("results/report.json", "results/triangulation.json",
                       "results/selftest.json"):
              text = open(path, encoding="utf-8").read()
              # bbox/center/path 为可定位生物识别信息；_cos_raw 为内部未舍入中间量，
              # 两者都不应出现在任何落盘产物中
              for bad in ('"bbox"', '"center"', '"path"', '"_cos_raw"'):
                  if bad in text:
                      print(f"FAIL {path}: 仍包含敏感字段 {bad}")
                      sys.exit(1)
              json.loads(text)
          print("PASS 报告结构校验通过，无坐标泄露")
          PY
      - name: 隐私终审体检
        run: python scripts/privacy_audit.py
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: face-match-lab-results
          path: |
            results/*.json
            assets/charts/**
